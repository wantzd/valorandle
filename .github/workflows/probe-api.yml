name: Seed team map

# TEMPORARY — seeds .github/data/team-map.json against the live API and commits
# it to this branch, so the map ships pre-populated instead of making the first
# scheduled run do all the discovery.
#
# Deleted before this branch is merged; the recurring job lives in
# update-players.yml.
on:
  push:
    branches:
      - feat/roster-sync
    paths:
      - '.github/workflows/probe-api.yml'
      - '.github/scripts/build_team_map.py'

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      # Wider than the weekly default: the first pass has to cover every league.
      # Third run of this job is the convergence check — with the map seeded it
      # should report 0 matches involving an unmapped team and commit nothing.
      - name: Build team map
        run: python .github/scripts/build_team_map.py
        env:
          VLRGG_API_URL: ${{ secrets.VLRGG_API_URL }}
          VLRGG_API_TOKEN: ${{ secrets.VLRGG_API_TOKEN }}
          MATCH_PAGES: '12'
          MAX_DETAIL_FETCHES: '120'

      - name: Commit team-map.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/data/team-map.json
          git diff --staged --quiet \
            && echo "team-map.json unchanged — nothing to commit" \
            || (git commit -m "chore: seed team-map.json" && git push)
