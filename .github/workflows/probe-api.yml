name: Probe API shape

# One-off reconnaissance to find out whether the vlrgg API exposes team rosters.
# No schedule, no writes to the repository.
#
# The push trigger is scoped to this branch only, because workflow_dispatch is
# not available until the file reaches the default branch. Both this workflow
# and .github/scripts/probe_api.py are meant to be deleted once the API shape
# is known — they must not reach main.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/orgmap-data-quality
    paths:
      - '.github/workflows/probe-api.yml'
      - '.github/scripts/probe_api.py'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only: this job inspects the API and prints structure, nothing else.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Probe API endpoints
        run: python .github/scripts/probe_api.py
        env:
          VLRGG_API_URL: ${{ secrets.VLRGG_API_URL }}
          VLRGG_API_TOKEN: ${{ secrets.VLRGG_API_TOKEN }}
